name: тестове

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Веднъж месечно, на 1-о число. Не защото кодът се променя сам, а защото
    # ставките се променят: справочникът има дата на последна сверка и този
    # пробег е напомнянето, че тя остарява.
    - cron: "0 6 1 * *"

jobs:
  testove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ставките в модела срещу справочника на скила
        # Без зависимости — чете markdown. Пуска се пръв, защото при разминаване
        # останалите два комплекта минават с грешни числа и резултатът им лъже.
        run: python test/stavki_test.py

      - name: Зависимости
        run: pip install -r test/requirements.txt

      - name: Комплект 1 — ставки и режими на труд
        run: python test/proverki_test.py

      - name: Комплект 2 — конструкция на файла, 300 семена
        run: python test/run_tests.py --semena 300

      - name: Проверка за изтекли лични данни
        # Ведомостите са лични данни по ОРЗД. Репото е публично. Тази стъпка
        # пази срещу това реални данни да влязат при обновяване на тестовете или
        # на примерите в документацията.
        #
        # Търси се по форма, не по имена на конкретни дружества или хора: списък
        # от истински имена, вписан тук, сам би бил изтичането, което стъпката се
        # опитва да предотврати.
        run: |
          # десетцифрено число (ЕГН) или деветцифрено (ЕИК), извън явно тестовите
          if git grep -nE '\b[0-9]{10}\b|\b[1-9][0-9]{8}\b' -- '*.md' '*.py' \
              | grep -vE '000000000|1\.95583|[0-9]{4}\.[0-9]{2}' ; then
            echo "Намерено е число с форма на ЕГН или ЕИК. Провери реда по-горе."
            exit 1
          fi
          echo "чисто"
