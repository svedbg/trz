name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Once a month, on the 1st. Not because the code changes by itself but
    # because the rates do: the reference file carries a verification date, and
    # the freshness job below FAILS the scheduled run when it has gone stale -
    # a reminder that cannot fail is not a reminder.
    - cron: "0 6 1 * *"
    # Once a week, on Monday: the two generated suites at the 3000 seeds the
    # README claims, so the claim stays continuously true instead of manually
    # re-proven after every model change.
    - cron: "0 6 * * 1"

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A second push supersedes the first; do not pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs once. Everything here is about the repository as a published artifact:
  # can the skill be installed, do the manifests agree, do the rates in the test
  # model still match the reference file, and did any personal data slip in.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: Rates in the test model against the skill's reference file
        # No dependencies - it reads markdown. Runs first, because on a drift the
        # payroll suites pass on the wrong figures and their result lies.
        run: python test/rates_test.py

      - name: Install dependencies
        run: pip install -r test/requirements.txt

      - name: Skill packaging - frontmatter, references, manifests, licences
        run: python test/skill_test.py

      - name: Refusal grader self-test
        # Free: it builds synthetic findings and checks that the grading in
        # eval_skill.py --refusal separates a skill that refused from one that
        # guessed a rate. The run it guards costs money and a quarter of an hour, so
        # a grader that quietly passed everything would be discovered late and
        # expensively.
        run: python test/eval_skill.py --selftest

      - name: Guard against leaked personal data
        # Payrolls are personal data under the GDPR and this repository is
        # public. This step guards against real data arriving with an update to
        # the tests or to the examples in the documentation.
        #
        # It matches by shape, not by the names of specific companies or people:
        # a list of real names committed here would itself be the leak the step
        # exists to prevent.
        run: |
          # A ten-digit number (national ID) or a nine-digit one (company ID).
          #
          # The exclusions are applied to the matched NUMBER, not to the line it sits
          # on. Filtering whole lines would drop `Иван Петров, ЕГН 8001011234,
          # осигурителен доход 2111.64 EUR` because of the money figure at the end -
          # and an ID next to a money figure is precisely the shape a leak takes here.
          hits=$(git grep -hoE '\b[0-9]{10}\b|\b[1-9][0-9]{8}\b' -- '*.md' '*.py' \
                 | grep -vxE '000000000' | sort -u || true)
          if [ -n "$hits" ]; then
            echo "Found numbers shaped like a national or company ID:"
            echo "$hits"
            echo
            echo "Locations:"
            for n in $hits; do git grep -nF "$n" -- '*.md' '*.py'; done
            exit 1
          fi
          echo "clean"

  # Runs per Python version. The payroll suites are pure stdlib plus openpyxl, so
  # they should hold across the versions people actually have installed; if one
  # of them breaks, this is where it shows.
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: Install dependencies
        run: pip install -r test/requirements.txt

      - name: Suite 1 - rates and working-time regimes
        run: python test/checks_test.py

      - name: Suite 2 - file construction and base composition, 300 seeds
        run: python test/run_tests.py --seeds 300

      # test/eval_skill.py is deliberately not run here. It calls Claude, so it
      # needs authentication and costs real money per run - a measured seed is
      # about USD 2.4. Run it by hand when the guidance in SKILL.md changes.

  # Scheduled runs only. The monthly firing checks that the rates have been
  # re-verified within the quarter - the one thing the ordinary jobs cannot fail
  # on, since a stale-but-consistent reference passes every cross-check. The
  # weekly firing runs the suites at the depth the README advertises.
  freshness:
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Rates verified within the last 92 days
        run: |
          date=$(grep -oP 'Последна сверка на ставките: \*\*\K[0-9.]+(?=\*\*)' \
                 skills/trz-expert/references/stavki.md)
          [ -n "$date" ] || { echo "no verification date found"; exit 1; }
          verified=$(date -d "$(echo "$date" | awk -F. '{print $3"-"$2"-"$1}')" +%s)
          age=$(( ( $(date +%s) - verified ) / 86400 ))
          echo "rates verified $date - $age days ago"
          if [ "$age" -gt 92 ]; then
            echo "::error::references/stavki.md was last verified $age days ago -"
            echo "::error::re-verify the rates (or consciously re-date the check-in)."
            exit 1
          fi

  deep-suites:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt
      - name: Install dependencies
        run: pip install -r test/requirements.txt
      - name: Both generated suites at the depth the README claims
        run: python test/run_tests.py --seeds 3000
