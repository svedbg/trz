name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      eval_model:
        description: >-
          Model for the paid eval job. Required for it to run at all, and required
          rather than defaulted on purpose: without --model the session runs on
          whatever the CLI is configured for, and a batch meant for one model has
          already been measured on another without saying so.
        required: false
        default: ""
        type: string
      eval_mode:
        description: "Which fixture the paid eval sends"
        required: false
        default: komplekt
        type: choice
        options: [komplekt, wide, pair, refusal]
      eval_seeds:
        description: "Seeds, comma-separated (e.g. 1,2,3). Ten at most."
        required: false
        default: "1"
        type: string
  schedule:
    # Once a month, on the 1st. Not because the code changes by itself but
    # because the rates do: the reference file carries a verification date, and
    # the freshness job below FAILS the scheduled run when it has gone stale -
    # a reminder that cannot fail is not a reminder.
    - cron: "0 6 1 * *"
    # Once a week, on Monday: all five suites (0-4) at the 3000 seeds the README
    # claims for the generated ones, so the claim stays continuously true instead
    # of manually re-proven after every model change.
    - cron: "0 6 * * 1"

# Every action is pinned to the commit SHA its tag resolved to on the day, with
# the tag kept in a trailing comment: a tag can be moved to different code, a SHA
# cannot. Dependabot (.github/dependabot.yml) reads the comment and raises the
# SHA when the tag advances.

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A second push supersedes the first; do not pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs once. Everything here is about the repository as a published artifact:
  # can the skill be installed, do the manifests agree, do the rates in the test
  # model still match the reference file, and did any personal data slip in.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: Rates in the test model against the skill's reference file
        # No dependencies - it reads markdown. Runs first, because on a drift the
        # payroll suites pass on the wrong figures and their result lies.
        run: python test/rates_test.py

      - name: Install dependencies
        run: pip install -r test/requirements.txt

      - name: Skill packaging - frontmatter, references, manifests, licences
        run: python test/skill_test.py

      - name: Pre-flight check for real payroll workbooks
        # tools/preflight.py is what a real export meets before the audit. Its
        # vocabulary is pinned against trz_model.COLUMNS here, so renaming a canonical
        # column cannot quietly send real ones to the unknown list, and its fixtures
        # are built in memory - no payroll, real or generated, is read.
        run: python test/preflight_test.py

      - name: Suite 5 - the chain below the payroll
        # ведомост -> обр. 1 -> обр. 6 -> внесено, one link broken at a time. The
        # checks that reconcile the payroll against the documents downstream of it had
        # no fixture at all until this suite; the payroll inside the set is clean, so
        # the run is a false-positive test as well as a detection one. It also grades a
        # synthetic correct report against the paid eval's keyword universe, which is
        # free and stops a pattern that matches nothing from reaching a paid run.
        run: python test/komplekt_test.py

      - name: Suite 6 - one person's timeline across months
        # I11: five months for the same people plus the documents behind the events.
        # Every month here is internally correct, so nothing in suites 1-4 can see these
        # defects - a salary that moved with no annex, a payment after the employment
        # ended, an employer-paid sick period starting twice for one spell.
        run: python test/lifecycle_test.py

      - name: Refusal grader self-test
        # Free: it builds synthetic findings and checks that the grading in
        # eval_skill.py --refusal separates a skill that refused from one that
        # guessed a rate. The run it guards costs money and a quarter of an hour, so
        # a grader that quietly passed everything would be discovered late and
        # expensively.
        run: python test/eval_skill.py --selftest

      - name: Guard against leaked personal data
        # Payrolls are personal data under the GDPR and this repository is
        # public. This step guards against real data arriving with an update to
        # the tests or to the examples in the documentation.
        #
        # It matches by shape, not by the names of specific companies or people:
        # a list of real names committed here would itself be the leak the step
        # exists to prevent.
        run: |
          # A ten-digit number (national ID) or a nine-digit one (company ID), in
          # every kind of text file the repository tracks - documentation, Python,
          # manifests, workflows, the social-preview card, and any CSV or plain text
          # a fixture might arrive as.
          #
          # The exclusions are applied to the matched NUMBER, not to the line it sits
          # on. Filtering whole lines would drop `Иван Петров, ЕГН 8001011234,
          # осигурителен доход 2111.64 EUR` because of the money figure at the end -
          # and an ID next to a money figure is precisely the shape a leak takes here.
          # Two numbers are allowed through: 000000000, the company ID every generated
          # fixture carries (SECURITY.md documents it), and 8001011234, which is the
          # illustration in the comment above - this file is scanned too.
          # An array of quoted pathspecs: an unquoted `*.md` would be expanded by the
          # shell against the repository root and quietly drop `test/*.md`.
          paths=('*.md' '*.py' '*.json' '*.yml' '*.yaml' '*.html' '*.csv' '*.txt')
          hits=$(git grep -hoE '\b[0-9]{10}\b|\b[1-9][0-9]{8}\b' -- "${paths[@]}" \
                 | grep -vxE '000000000|8001011234' | sort -u || true)
          if [ -n "$hits" ]; then
            echo "Found numbers shaped like a national or company ID:"
            echo "$hits"
            echo
            echo "Locations:"
            for n in $hits; do git grep -nF "$n" -- "${paths[@]}"; done
            exit 1
          fi
          echo "clean"

      - name: Guard against leaked personal data inside spreadsheets
        # The step above cannot see into an .xlsx: it is a zip, and git grep reads
        # the compressed bytes. Yet the fixtures are spreadsheets, so a national ID
        # typed into a cell is the likeliest form a leak takes here. Every tracked
        # workbook is unpacked and the XML that holds cell values - the worksheets,
        # and xl/sharedStrings.xml when the writer used shared rather than inline
        # strings - is scanned for the same two shapes.
        run: |
          # Same shapes as above. The lookbehind refuses a digit or a dot before the
          # run, so the tail of a float like 85.56999999999999 is not read as an ID;
          # a number cell holding one is written as <v>8001011234</v> and still hits.
          pattern='(?<![0-9.])[0-9]{10}(?![0-9])|(?<![0-9.])[1-9][0-9]{8}(?![0-9])'
          status=0
          tmp=$(mktemp -d)
          for f in $(git ls-files -- '*.xlsx'); do
            dir="$tmp/$(echo "$f" | tr '/' '_')"
            mkdir -p "$dir"
            unzip -q -o "$f" -d "$dir"
            files=$(find "$dir/xl/worksheets" "$dir/xl/sharedStrings.xml" \
                         -name '*.xml' 2>/dev/null || true)
            if [ -z "$files" ]; then
              echo "$f: no worksheet XML inside - not a workbook this guard can read"
              status=1
              continue
            fi
            hits=$(grep -ohP "$pattern" $files | grep -vxE '000000000' | sort -u || true)
            if [ -n "$hits" ]; then
              echo "$f: numbers shaped like a national or company ID inside the workbook:"
              echo "$hits"
              status=1
            else
              echo "$f: clean"
            fi
          done
          exit $status

  # Runs per Python version. The payroll suites are pure stdlib plus openpyxl, so
  # they should hold across the versions people actually have installed; if one
  # of them breaks, this is where it shows.
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: Install dependencies
        run: pip install -r test/requirements.txt

      - name: Suite 1 - rates and working-time regimes
        run: python test/checks_test.py

      - name: All five suites (0-4) - rates, static payroll, generated payrolls, two-month pairs, formulas; 300 seeds
        run: python test/run_tests.py --seeds 300

      # test/eval_skill.py is deliberately not run here. It calls Claude, so it
      # needs authentication and costs real money per run - a measured seed is
      # about USD 2.4. Run it by hand when the guidance in SKILL.md changes.

  # Scheduled runs only. The monthly firing checks that the rates have been
  # re-verified within the quarter - the one thing the ordinary jobs cannot fail
  # on, since a stale-but-consistent reference passes every cross-check. The
  # weekly firing runs the suites at the depth the README advertises.
  eval:
    # The only job that spends money, and the only one that cannot run by accident:
    # manual dispatch, and even then only when a model was named. It is deliberately
    # NOT a gate on pull requests - the score is stochastic, one seed moves it by ten
    # points, and this repository fails a suite for a single false positive. A number
    # like that belongs in a report someone reads, not in a required check.
    if: github.event_name == 'workflow_dispatch' && inputs.eval_model != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r test/requirements.txt
          npm install -g @anthropic-ai/claude-code
      - name: Install the skill from this checkout
        # The eval refuses to spend anything unless every resolvable copy of the skill
        # matches the tree being tested. On a runner there is no copy at all, so this
        # is what makes the run measure this commit rather than refuse to start.
        run: |
          mkdir -p ~/.claude/skills
          ln -s "$GITHUB_WORKSPACE/skills/trz-expert" ~/.claude/skills/trz-expert
      - name: Paid eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || {
            echo "::error::no ANTHROPIC_API_KEY secret - the eval cannot start a session"
            exit 1
          }
          MODE=""
          case "${{ inputs.eval_mode }}" in
            komplekt) MODE="--komplekt" ;;
            pair)     MODE="--pair" ;;
            refusal)  MODE="--refusal" ;;
          esac
          python test/eval_skill.py --model "${{ inputs.eval_model }}" $MODE \
                 --seeds-list "${{ inputs.eval_seeds }}"
      - name: Keep the transcripts and the scores
        # A paid run that leaves nothing behind has to be paid for twice; --regrade
        # re-scores these files for free when the keywords change.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-${{ inputs.eval_mode }}-${{ inputs.eval_model }}
          path: /tmp/trz-eval/
          retention-days: 30

  freshness:
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rates verified within the last 92 days
        run: |
          date=$(grep -oP 'Последна сверка на ставките: \*\*\K[0-9.]+(?=\*\*)' \
                 skills/trz-expert/references/stavki.md)
          [ -n "$date" ] || { echo "no verification date found"; exit 1; }
          verified=$(date -d "$(echo "$date" | awk -F. '{print $3"-"$2"-"$1}')" +%s)
          age=$(( ( $(date +%s) - verified ) / 86400 ))
          echo "rates verified $date - $age days ago"
          if [ "$age" -gt 92 ]; then
            echo "::error::references/stavki.md was last verified $age days ago -"
            echo "::error::re-verify the rates (or consciously re-date the check-in)."
            exit 1
          fi

  deep-suites:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt
      - name: Install dependencies
        run: pip install -r test/requirements.txt
      - name: All five suites (0-4) at the 3000 seeds the README claims
        run: python test/run_tests.py --seeds 3000
