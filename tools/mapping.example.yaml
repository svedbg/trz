# Опис на колоните за едно дружество — попълва се веднъж, ползва се всеки месец.
#
# Всяко дружество води ведомостта си по своему, а проверките търсят колоните по точен
# български текст. Този файл казва кое как се казва тук, вместо да се гадае наново всеки
# месец. Гадаенето остава за колоните, които не са описани.
#
#   python tools/preflight.py ВЕДОМОСТ.xlsx --mapping tools/mapping.example.yaml
#
# Във файла няма лични данни — само заглавия на колони и данни за дружеството, — затова
# може да се държи във версионен контрол. Реални ведомости не влизат в репозиторито.

company: "Измислено ЕООД"

# Двете стойности, които никоя ведомост не носи. Без тях B3 (МОД) и F5 (ТЗПБ) остават
# „недостатъчни данни“. Редът се взима от приложението към ЗБДОО за периода.
kid: "62"
group: 3
tzpb: 0.4

# По избор. Ако липсва, заглавният ред се намира по съдържание — но когато файлът има
# няколко реда заглавия или обединена шапка, е по-сигурно да се каже.
# header_row: 5

# Понятие -> заглавието, с което това дружество го нарича.
# Ключовете са затворен списък; правописна грешка в ключ спира проверката, вместо да
# бъде подмината мълчаливо. Допустимите понятия ги изброява самият доклад при грешка.
columns:
  "осиг. доход": "Дох.осиг."
  "лични вноски": "Осиг. за сметка на лицето"
  "нето": "За получаване"
  "изплатено": "Преведено по банка"

# Колони, които съществуват, но не участват в одита. Описани тук, те спират да се
# появяват в списъка с неразпознати — и така списъкът остава кратък и се чете.
ignore:
  - "Забележка"
  - "Подпис"
  - "Отдел"
